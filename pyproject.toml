[project]
name = "voicetype"
version = "0.1.0"
description = "Голосовой ввод в терминал: хоткей → диктовка → окно правки → вставка"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-xlib>=0.33",
]

[project.scripts]
voicetype = "voicetype.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicetype"]
