[project]
name = "voicetype"
version = "0.1.0"
description = "Голосовой ввод в терминал: хоткей → диктовка → окно правки → вставка"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-xlib>=0.33",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["x11: integration tests requiring a disposable X11 display"]

[project.scripts]
voicetype = "voicetype.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicetype"]
